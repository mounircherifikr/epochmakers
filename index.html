<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة التأثير البشري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        .tab-btn.active { border-bottom-color: #f59e0b; color: #fbbf24; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-amber-500/10 border border-amber-500/30 rounded-lg">
                <i class="fa-solid fa-brain text-amber-500 text-lg"></i>
            </div>
            <h1 class="text-lg font-bold text-white">موسوعة التأثير البشري</h1>
        </div>
        <input type="text" id="searchInput" placeholder="ابحث باسم الشخصية..." 
               class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-1.5 text-sm w-64 focus:outline-none focus:border-amber-500 text-slate-200">
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        <div id="figuresGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Modal Drawer -->
    <div id="detailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-50 flex justify-end">
        <div class="w-full max-w-2xl bg-slate-900 border-r border-slate-800 h-full flex flex-col shadow-2xl relative">
            <button id="closeModal" class="absolute top-4 left-4 bg-slate-800 text-slate-400 p-2 rounded-full hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <div class="p-6 border-b border-slate-800 bg-slate-950/40" id="modalHeader"></div>
            
            <div class="flex border-b border-slate-800 bg-slate-950/80 px-6 gap-4 text-xs font-medium">
                <button class="tab-btn active py-3 border-b-2 border-amber-500 text-amber-400" data-tab="tab-bio">السيرة والأحداث</button>
                <button class="tab-btn py-3 border-b-2 border-transparent text-slate-400" data-tab="tab-ages">المراحل العمرية</button>
                <button class="tab-btn py-3 border-b-2 border-transparent text-slate-400" data-tab="tab-awards">الجوائز والأوسمة</button>
                <button class="tab-btn py-3 border-b-2 border-transparent text-slate-400" data-tab="tab-links">شبكة العلاقات</button>
            </div>

            <div class="p-6 overflow-y-auto flex-1 space-y-4">
                <div id="tab-bio" class="tab-content space-y-4"></div>
                <div id="tab-ages" class="tab-content hidden space-y-4"></div>
                <div id="tab-awards" class="tab-content hidden space-y-4"></div>
                <div id="tab-links" class="tab-content hidden space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        // بيانات واقعية حقيقية مع صور من Wikimedia Commons
        const realFigures = [
            {
                id: "einstein",
                name: "ألبيرت أينشتاين",
                title: "عالم فيزياء نظرية",
                category: "علوم وریاضيات",
                era: "القرن العشرين",
                birth: "1879", death: "1955",
                image: "https://upload.wikimedia.org/wikipedia/commons/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg",
                short_bio: "واضع نظرية النسبية العامة والخاصة، وأحد أهم علماء الفيزياء في التاريخ.",
                full_bio: "عالم فيزياء ألماني السويسري السويسري الأصل، حائز على جائزة نوبل في الفيزياء عام 1921 لإسهاماته في الفيزياء النظرية وخاصة اكتشافه لظاهرة التأثير الكهروضوئي.",
                timeline: [
                    { year: 1905, title: "عام المعجزات", desc: "نشر 4 أوراق علمية ثورية من بينها النسبية الخاصة والظاهرة الكهروضوئية." },
                    { year: 1915, title: "صياغة النسبية العامة", desc: "أكمل نظرية الجاذبية الحديثة التي غيرت فهمنا للكون والزمان." }
                ],
                age_stages: [
                    { stage: "الشباب (1903)", age: 24, img: "https://upload.wikimedia.org/wikipedia/commons/d/d3/Albert_Einstein_head.jpg" },
                    { stage: "النضج (1921)", age: 42, img: "https://upload.wikimedia.org/wikipedia/commons/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg" },
                    { stage: "السن المتقدمة (1947)", age: 68, img: "https://upload.wikimedia.org/wikipedia/commons/d/d5/Albert_Einstein_1947.jpg" }
                ],
                awards: [{ name: "جائزة نوبل في الفيزياء", year: 1921, desc: "عن تفسيره للتأثير الكهروضوئي." }],
                connections: [{ target: "نيوتن", relation: "تطوير واستبدال قوانين الجاذبية الكلاسيكية" }]
            },
            {
                id: "ibn_sina",
                name: "ابن سينا (Avicenna)",
                title: "فيلسوف وعالم طب",
                category: "علوم وریاضيات",
                era: "العصر الذهبي الإسلامي",
                birth: "980", death: "1037",
                image: "https://upload.wikimedia.org/wikipedia/commons/a/a0/Avicenna_Portrait_on_Directory_of_Iranian_National_National_Figures.jpg",
                short_bio: "أبو الطب الحديث ومؤلف كتاب 'القانون في الطب' الذي درس في أوروبا لقرون.",
                full_bio: "عالم وباحث مسلم ينتمي إلى بخارى، اشتهر بالطب والفلسفة، وكتب ما يقارب 450 مؤلفاً في مواضيع مختلفة مثل الفلك، الكيمياء، الفلسفة والطب.",
                timeline: [
                    { year: 1025, title: "إتمام كتاب القانون في الطب", desc: "أصدر أضخم موسوعة طبية اعتمدت عليها الجامعات الأوروبية حتى القرن السابع عشر." }
                ],
                age_stages: [
                    { stage: "رسم تخيلي للشيخ الرئيس", age: 50, img: "https://upload.wikimedia.org/wikipedia/commons/a/a0/Avicenna_Portrait_on_Directory_of_Iranian_National_National_Figures.jpg" }
                ],
                awards: [{ name: "لقب أمير الأطباء", year: 1010, desc: "تكريماً لإسهاماته في التشريح وعلم الأدوية." }],
                connections: [{ target: "أرسطو", relation: "شرح وتطوير الفلسفة الأرسطية" }]
            }
        ];

        function renderCards() {
            const grid = document.getElementById("figuresGrid");
            grid.innerHTML = realFigures.map(f => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-amber-500/50 transition cursor-pointer" onclick="openModal('${f.id}')">
                    <img src="${f.image}" class="w-full h-56 object-cover object-top rounded-lg mb-4">
                    <h3 class="font-bold text-lg text-white mb-1">${f.name}</h3>
                    <p class="text-xs text-amber-400 mb-2">${f.title} (${f.birth} - ${f.death})</p>
                    <p class="text-xs text-slate-400 leading-relaxed">${f.short_bio}</p>
                </div>
            `).join("");
        }

        function openModal(id) {
            const fig = realFigures.find(f => f.id === id);
            if (!fig) return;

            document.getElementById("modalHeader").innerHTML = `
                <div class="flex items-center gap-4">
                    <img src="${fig.image}" class="w-16 h-16 rounded-full object-cover border-2 border-amber-500">
                    <div>
                        <h2 class="text-xl font-bold text-white">${fig.name}</h2>
                        <p class="text-xs text-amber-400">${fig.title} • ${fig.era}</p>
                    </div>
                </div>`;

            document.getElementById("tab-bio").innerHTML = `
                <p class="text-xs text-slate-300 leading-relaxed">${fig.full_bio}</p>
                <h4 class="text-xs font-bold text-amber-400 pt-2">اللحظات المفصلية:</h4>
                ${fig.timeline.map(t => `<div class="bg-slate-950 p-3 rounded text-xs border border-slate-800"><span class="font-bold text-amber-500">${t.year}:</span> ${t.title} - ${t.desc}</div>`).join("")}`;

            document.getElementById("tab-ages").innerHTML = `
                <div class="grid grid-cols-2 gap-3">
                    ${fig.age_stages.map(a => `
                        <div class="bg-slate-950 p-2 rounded text-center border border-slate-800">
                            <img src="${a.img}" class="w-full h-36 object-cover rounded mb-2">
                            <p class="text-xs font-bold text-amber-400">${a.stage}</p>
                        </div>
                    `).join("")}
                </div>`;

            document.getElementById("tab-awards").innerHTML = fig.awards.map(a => `
                <div class="bg-slate-950 p-3 rounded border border-slate-800 text-xs">
                    <span class="font-bold text-amber-400">${a.name} (${a.year}):</span> ${a.desc}
                </div>`).join("");

            document.getElementById("tab-links").innerHTML = fig.connections.map(c => `
                <div class="bg-slate-950 p-3 rounded border border-slate-800 text-xs flex justify-between">
                    <span class="font-bold text-slate-200">${c.target}</span>
                    <span class="text-amber-400">${c.relation}</span>
                </div>`).join("");

            document.getElementById("detailModal").classList.remove("hidden");
        }

        // Tabs
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active", "text-amber-400", "border-amber-500"));
                btn.classList.add("active", "text-amber-400", "border-amber-500");
                document.querySelectorAll(".tab-content").forEach(c => c.classList.add("hidden"));
                document.getElementById(btn.dataset.tab).classList.remove("hidden");
            }
        });

        document.getElementById("closeModal").onclick = () => document.getElementById("detailModal").classList.add("hidden");
        renderCards();
    </script>
</body>
</html>
