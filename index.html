<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الـ 1000 شخصية الأكثر تأثيراً في التاريخ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="p-2.5 bg-amber-500/10 border border-amber-500/30 rounded-xl">
                <i class="fa-solid fa-timeline text-amber-500 text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">أثر 1000</h1>
                <p class="text-xs text-slate-400">سجل التاريخ التفاعلي وعلاقات التأثير البشري</p>
            </div>
        </div>
        <div class="flex items-center gap-3 w-full md:w-auto">
            <input type="text" id="searchInput" placeholder="ابحث باسم الشخصية أو الجائزة..." 
                   class="w-full md:w-80 bg-slate-800/80 border border-slate-700/80 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-200">
        </div>
    </header>

    <div class="flex min-h-[calc(100vh-73px)]">
        <aside class="w-72 border-l border-slate-800/80 bg-slate-900/40 p-6 hidden lg:block shrink-0">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">التصنيف الرئيسي</h3>
            <div id="categoryFilters" class="space-y-1 mb-6"></div>
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">الحقبة التاريخية</h3>
            <div id="eraFilters" class="space-y-1"></div>
        </aside>

        <main class="flex-1 p-6 overflow-y-auto">
            <div id="figuresGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
            <div class="mt-8 flex justify-between items-center border-t border-slate-800/80 pt-6">
                <p class="text-xs text-slate-400" id="resultsCount">عرض 0 شخصية</p>
                <div class="flex gap-2">
                    <button id="prevPage" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-xs border border-slate-700">السابق</button>
                    <span id="pageIndicator" class="text-xs text-slate-300 self-center px-2">1</span>
                    <button id="nextPage" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-xs border border-slate-700">التالي</button>
                </div>
            </div>
        </main>
    </div>

    <div id="detailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-50 flex justify-end">
        <div class="w-full max-w-3xl bg-slate-900 border-r border-slate-800 h-full flex flex-col shadow-2xl relative">
            <button id="closeModal" class="absolute top-5 left-5 bg-slate-800/80 text-slate-400 p-2 rounded-full z-10"><i class="fa-solid fa-xmark"></i></button>
            <div class="p-8 border-b border-slate-800 bg-slate-950/40" id="modalHeader"></div>
            <div class="flex border-b border-slate-800 bg-slate-950/80 px-8 gap-6 text-sm">
                <button class="tab-btn active py-3 font-medium border-b-2 border-amber-500 text-amber-400" data-tab="tab-timeline">السيرة واللحظات</button>
                <button class="tab-btn py-3 font-medium border-b-2 border-transparent text-slate-400" data-tab="tab-ages">المراحل العمرية</button>
                <button class="tab-btn py-3 font-medium border-b-2 border-transparent text-slate-400" data-tab="tab-awards">الجوائز والأوسمة</button>
                <button class="tab-btn py-3 font-medium border-b-2 border-transparent text-slate-400" data-tab="tab-links">شبكة التأثير</button>
            </div>
            <div class="p-8 overflow-y-auto flex-1 space-y-6">
                <div id="tab-timeline" class="tab-content"></div>
                <div id="tab-ages" class="tab-content hidden"></div>
                <div id="tab-awards" class="tab-content hidden"></div>
                <div id="tab-links" class="tab-content hidden"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
