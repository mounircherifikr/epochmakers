<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الأثر البشري - مكتبة الشخصيات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        .tab-btn.active { border-bottom-color: #f59e0b; color: #fbbf24; }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-4px); border-color: rgba(245, 158, 11, 0.4); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="p-2.5 bg-amber-500/10 border border-amber-500/30 rounded-xl">
                <i class="fa-solid fa-book-atlas text-amber-500 text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">موسوعة الأثر البشري</h1>
                <p class="text-xs text-slate-400">اتصال مباشر وسريع مع أرشيف ويكيبيديا العربي</p>
            </div>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="relative flex-1 md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن أي شخصية تاريخية..." 
                       class="w-full bg-slate-800/80 border border-slate-700/80 rounded-lg pr-9 pl-4 py-2 text-sm focus:outline-none focus:border-amber-500 text-slate-200">
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex min-h-[calc(100vh-73px)]">
        
        <!-- Sidebar -->
        <aside class="w-64 border-l border-slate-800/80 bg-slate-900/40 p-6 hidden lg:block shrink-0">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">قوائم سريعة</h3>
            <div class="space-y-1">
                <button class="preset-btn w-full text-right px-3 py-2 rounded text-xs text-amber-400 bg-amber-500/10 font-bold" data-query="علماء">علماء ورياضيون</button>
                <button class="preset-btn w-full text-right px-3 py-2 rounded text-xs text-slate-400 hover:bg-slate-800" data-query="فلاسفة">فلاسفة ومفكرون</button>
                <button class="preset-btn w-full text-right px-3 py-2 rounded text-xs text-slate-400 hover:bg-slate-800" data-query="قادة تاريخيون">قادة وسياسيون</button>
                <button class="preset-btn w-full text-right px-3 py-2 rounded text-xs text-slate-400 hover:bg-slate-800" data-query="شعراء عرب">أدباء وشعراء</button>
            </div>
        </aside>

        <!-- Grid Area -->
        <main class="flex-1 p-6 overflow-y-auto">
            <div id="loader" class="flex flex-col items-center justify-center py-20 gap-4">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs text-slate-400">جاري تحميل الشخصيات الموثقة...</p>
            </div>

            <div id="figuresGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden"></div>
        </main>
    </div>

    <!-- Modal Drawer -->
    <div id="detailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-50 flex justify-end">
        <div class="w-full max-w-2xl bg-slate-900 border-r border-slate-800 h-full flex flex-col shadow-2xl relative">
            <button id="closeModal" class="absolute top-4 left-4 bg-slate-800 text-slate-400 p-2 rounded-full hover:text-white z-10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <div class="p-6 border-b border-slate-800 bg-slate-950/40" id="modalHeader"></div>
            
            <div class="flex border-b border-slate-800 bg-slate-950/80 px-6 gap-6 text-xs font-medium">
                <button class="tab-btn active py-3 border-b-2 border-amber-500 text-amber-400" data-tab="tab-bio">السيرة الموثقة</button>
                <button class="tab-btn py-3 border-b-2 border-transparent text-slate-400" data-tab="tab-gallery">معرض الصور التاريخية</button>
                <button class="tab-btn py-3 border-b-2 border-transparent text-slate-400" data-tab="tab-links">الارتباطات والتأثير</button>
            </div>

            <div class="p-6 overflow-y-auto flex-1 space-y-4">
                <div id="tab-bio" class="tab-content space-y-4"></div>
                <div id="tab-gallery" class="tab-content hidden space-y-4"></div>
                <div id="tab-links" class="tab-content hidden space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        // قائمة مرجعية مع إمكانية البحث المباشر في ويكيبيديا لكل شخصيات العالم
        const defaultList = [
            "ألبيرت أينشتاين", "ابن سينا", "إسحاق نيوتن", "ابن خلدون", "ماري كوري", 
            "الخوارزمي", "نيلسون مانديلا", "أبو بكر الرازي", "ليوناردو دا فينشي", 
            "صلاح الدين الأيوبي", "سقراط", "نيكولا تسلا", "ابن الهيثم", "غاندي", "الفارابي"
        ];

        let currentFigures = [];

        async function fetchWikipediaFigures(searchTerm = "علماء") {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('figuresGrid').classList.add('hidden');

            try {
                // جلب قائمة نتائج عبر MediaWiki Search API (سريع ومضمون)
                const searchUrl = `https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(searchTerm)}&srlimit=24&format=json&origin=*`;
                const searchRes = await fetch(searchUrl);
                const searchData = await searchRes.json();
                
                const titles = searchData.query.search.map(item => item.title).join('|');

                // جلب التفاصيل والصور الرسمية
                const detailsUrl = `https://ar.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(titles)}&prop=pageimages|extracts|pageprops&pithumbsize=400&exintro=1&explaintext=1&format=json&origin=*`;
                const detailsRes = await fetch(detailsUrl);
                const detailsData = await detailsRes.json();

                const pages = detailsData.query.pages;
                currentFigures = Object.values(pages).map(p => ({
                    id: p.pageid,
                    name: p.title,
                    image: p.thumbnail ? p.thumbnail.source : 'https://via.placeholder.com/400x400/0f172a/ffffff?text=' + encodeURIComponent(p.title),
                    snippet: p.extract ? p.extract.substring(0, 120) + '...' : 'شخصية موثقة في الأرشيف التاريخي.',
                    fullBio: p.extract || 'لا توجد نبذة كاملة مسجلة.'
                }));

                document.getElementById('loader').classList.add('hidden');
                document.getElementById('figuresGrid').classList.remove('hidden');
                renderGrid(currentFigures);

            } catch (err) {
                console.error("خطأ التنزيل:", err);
                document.getElementById('loader').innerHTML = `<p class="text-amber-400 text-xs">تعذر الاتصال بـ Wikipedia. اضغط زر إعادة المحاولة.</p>`;
            }
        }

        function renderGrid(data) {
            const grid = document.getElementById('figuresGrid');
            grid.innerHTML = data.map(f => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 card-hover cursor-pointer flex flex-col justify-between" onclick="openModal('${f.id}')">
                    <div>
                        <img src="${f.image}" class="w-full h-48 object-cover object-top rounded-lg mb-3" loading="lazy" onerror="this.src='https://via.placeholder.com/300?text=صورة+غير+متوفرة'">
                        <h3 class="font-bold text-white text-sm mb-1">${f.name}</h3>
                        <p class="text-xs text-slate-400 leading-relaxed line-clamp-3">${f.snippet}</p>
                    </div>
                    <button class="mt-3 w-full bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs py-1.5 rounded transition">عرض الملف المكتمل</button>
                </div>
            `).join('');
        }

        async function openModal(id) {
            const fig = currentFigures.find(f => f.id == id);
            if (!fig) return;

            document.getElementById('modalHeader').innerHTML = `
                <div class="flex items-center gap-4">
                    <img src="${fig.image}" class="w-16 h-16 rounded-full object-cover border-2 border-amber-500">
                    <div>
                        <h2 class="text-lg font-bold text-white">${fig.name}</h2>
                        <span class="text-xs bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20">سجل موثق</span>
                    </div>
                </div>`;

            document.getElementById('tab-bio').innerHTML = `
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs text-slate-300 leading-relaxed space-y-3">
                    <p>${fig.fullBio}</p>
                </div>`;

            document.getElementById('tab-gallery').innerHTML = `<div class="animate-pulse text-xs text-slate-400">جاري سحب الأرشيف المصور من Wikimedia...</div>`;
            document.getElementById('tab-links').innerHTML = `<div class="animate-pulse text-xs text-slate-400">جاري استخراج الشخصيات ذات الصلة...</div>`;

            document.getElementById('detailModal').classList.remove('hidden');

            // جلب صور إضافية للشخصية من Wikimedia Commons
            try {
                const commonsUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(fig.name)}&gsrlimit=6&prop=imageinfo&iiprop=url&format=json&origin=*`;
                const res = await fetch(commonsUrl);
                const cData = await res.json();
                
                if (cData.query && cData.query.pages) {
                    const imgs = Object.values(cData.query.pages).map(p => p.imageinfo[0].url);
                    document.getElementById('tab-gallery').innerHTML = `
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            ${imgs.map(img => `<img src="${img}" class="w-full h-28 object-cover rounded-lg border border-slate-800" loading="lazy">`).join('')}
                        </div>`;
                } else {
                    document.getElementById('tab-gallery').innerHTML = `<p class="text-xs text-slate-400">لا توجد صور إضافية في أرشيف Commons.</p>`;
                }
            } catch {
                document.getElementById('tab-gallery').innerHTML = `<p class="text-xs text-slate-400">تعذر تحميل المعرض المصور.</p>`;
            }

            // جلب روابط ذات صلة من داخل المقال
            try {
                const linksUrl = `https://ar.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(fig.name)}&prop=links&pllimit=8&format=json&origin=*`;
                const lRes = await fetch(linksUrl);
                const lData = await lRes.json();
                const page = Object.values(lData.query.pages)[0];
                
                if (page.links) {
                    document.getElementById('tab-links').innerHTML = `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            ${page.links.map(l => `
                                <div class="bg-slate-950 p-2.5 rounded border border-slate-800 text-xs text-slate-300 flex items-center justify-between cursor-pointer hover:border-amber-500/40" onclick="searchSpecific('${l.title}')">
                                    <span>${l.title}</span>
                                    <i class="fa-solid fa-arrow-left text-amber-500/60 text-[10px]"></i>
                                </div>
                            `).join('')}
                        </div>`;
                } else {
                    document.getElementById('tab-links').innerHTML = `<p class="text-xs text-slate-400">لا توجد روابط صريحة مسجلة.</p>`;
                }
            } catch {
                document.getElementById('tab-links').innerHTML = `<p class="text-xs text-slate-400">تعذر تحميل شبكة العلاقات.</p>`;
            }
        }

        function searchSpecific(name) {
            document.getElementById('closeModal').click();
            document.getElementById('searchInput').value = name;
            fetchWikipediaFigures(name);
        }

        // إعدادات البحث والتنقل
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                if (e.target.value.trim().length > 1) {
                    fetchWikipediaFigures(e.target.value.trim());
                }
            }, 500);
        });

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.preset-btn').forEach(b => {
                    b.classList.remove('bg-amber-500/10', 'text-amber-400', 'font-bold');
                    b.classList.add('text-slate-400');
                });
                btn.classList.add('bg-amber-500/10', 'text-amber-400', 'font-bold');
                fetchWikipediaFigures(btn.dataset.query);
            };
        });

        // Tabs Modal
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'text-amber-400', 'border-amber-500'));
                btn.classList.add('active', 'text-amber-400', 'border-amber-500');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(btn.dataset.tab).classList.remove('hidden');
            };
        });

        document.getElementById('closeModal').onclick = () => document.getElementById('detailModal').classList.add('hidden');

        // التشغيل الأول
        fetchWikipediaFigures("أبرز الشخصيات التاريخية");
    </script>
</body>
</html>
