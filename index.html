<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epoch Makers | The Interactive Encyclopedia</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #cbd5e1;
            --accent-color: #eab308;
            --card-bg: #1e293b;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        
        .main-header { text-align: center; padding: 50px 20px; background-color: #0b1120; border-bottom: 2px solid #334155; }
        .main-header h1 { color: var(--accent-color); font-size: 3.5rem; margin: 0; }
        .main-header p { font-size: 1.2rem; }

        .characters-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; padding: 50px 20px; }
        
        /* Removed onclick JS and made the card a real link */
        .character-link { text-decoration: none; color: inherit; display: block; }
        
        .character-card { background-color: var(--card-bg); border: 1px solid #334155; border-radius: 12px; padding: 25px; width: 250px; text-align: center; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .character-card:hover { transform: translateY(-8px); border-color: var(--accent-color); box-shadow: 0 12px 20px rgba(0,0,0,0.5); }
        .character-card img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-color); margin-bottom: 15px; }
        .character-card h3 { color: #fff; margin: 0 0 8px 0; font-size: 1.3rem;}
        .character-card p { font-size: 0.95rem; margin: 0; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="main-header">
        <h1>Epoch Makers</h1>
        <p>The Interactive Encyclopedia of History & Science</p>
    </div>

    <div class="characters-grid">
        
        <!-- Card 1: John von Neumann (Now wrapped in a link tag) -->
        <a href="characters/neumann.html" class="character-link">
            <div class="character-card">
                <img src="images/neumann.jpg" alt="John von Neumann" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%2364748b%22%3E%3Cpath d=%22M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z%22/%3E%3C/svg%3E'">
                <h3>John von Neumann</h3>
                <p>Mathematics, Economics & Computing</p>
            </div>
        </a>

        <!-- Ready for future cards -->
        <!-- 
        <a href="characters/einstein.html" class="character-link">
            <div class="character-card"> ... </div>
        </a> 
        -->
        
    </div>

</body>
</html>
